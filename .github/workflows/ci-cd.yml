name: CI/CD — Build, Test & Publish (personal-assistant-web)

on:
  push:
    branches: [ "main", "homolog" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/cralan77/personal-assistant-web:${{ github.ref_name == 'homolog' && 'homolog' || 'latest' }}
            ghcr.io/cralan77/personal-assistant-web:${{ github.sha }}
